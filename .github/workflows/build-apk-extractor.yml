name: Build APK Extractor

on:
  push:
    branches: [main]
    paths:
      - 'apk-extractor/**'
      - '.github/workflows/build-apk-extractor.yml'
  pull_request:
    paths:
      - 'apk-extractor/**'
      - '.github/workflows/build-apk-extractor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p apk-extractor --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Extractor
          path: apk-extractor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Save compiled APK into repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p apk-extractor/releases
          cp apk-extractor/app/build/outputs/apk/debug/app-debug.apk apk-extractor/releases/APK-Extractor-v1.0.0.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk-extractor/releases/APK-Extractor-v1.0.0.apk
          if git diff --cached --quiet; then
            echo 'APK already current.'
            exit 0
          fi
          git commit -m 'Add APK Extractor v1.0.0 binary [skip ci]'
          git push
